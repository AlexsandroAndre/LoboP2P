services:
  app:
    build: .
    container_name: lobo-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lobo:secret@db:5432/lobodb
      NODE_ENV: production
    networks:
      - lobo-network

  db:
    image: postgres:15-alpine
    container_name: lobo-db
    restart: always
    environment:
      POSTGRES_USER: lobo
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lobodb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobo -d lobodb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lobo-network  

volumes:
  db_data:

networks:
  lobo-network:
    driver: bridge
